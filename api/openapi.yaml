openapi: 3.0.3

info:
  title: aide API
  description: |
    REST API for aide — a lightweight Claude CLI bot daemon.
    Exposes observability endpoints for active PTY sessions, workers, channels,
    and wirings. Intended as the backend for a future management GUI.
  version: 0.1.0
  contact:
    name: aide
    url: https://github.com/sfathall/aide

servers:
  - url: http://localhost:8080
    description: Local daemon (default)

tags:
  - name: health
    description: Daemon liveness and readiness
  - name: sessions
    description: Active Claude PTY sessions
  - name: tasks
    description: Scheduled periodic prompts
  - name: workers
    description: Configured worker definitions (planned)
  - name: channels
    description: Configured channel adapters (planned)
  - name: wirings
    description: Worker–channel wiring rules (planned)

paths:

  # ─── Health ──────────────────────────────────────────────────────────────────

  /api/v1/health:
    get:
      operationId: getHealth
      summary: Daemon health check
      description: Returns 200 when the daemon is running and accepting requests.
      tags: [health]
      responses:
        "200":
          description: Daemon is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  # ─── Sessions ─────────────────────────────────────────────────────────────────

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List active PTY sessions
      description: |
        Returns the session keys of all Claude PTY sessions that are currently
        alive. A session key encodes the worker, channel, and sender depending
        on the `session_mode` of the matching wiring:
        - `worker-shared` → `{worker_id}`
        - `shared`        → `{worker_id}:{channel_id}`
        - `per-user`      → `{worker_id}:{channel_id}:{sender_id}`
      tags: [sessions]
      responses:
        "200":
          description: List of active session keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
              example:
                count: 2
                active_sessions:
                  - "assistant:my-telegram:123456789"
                  - "assistant:my-webex:alice@example.com"

  # ─── Tasks ───────────────────────────────────────────────────────────────────

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List all scheduled tasks
      description: Returns all tasks defined in tasks.yaml, enabled or not.
      tags: [tasks]
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
              example:
                tasks:
                  - id: morning-standup
                    name: Morning Standup Summary
                    enabled: true
                    worker_id: assistant
                    session_mode: task-isolated
                    schedule: "0 9 * * 1-5"
                    timeout_secs: 120
                    outputs:
                      - channel_id: my-telegram
                        room_id: "123456789"

  /api/v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Get a task by ID
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found

  /api/v1/tasks/{task_id}/run:
    post:
      operationId: runTask
      summary: Trigger a task immediately (manual run)
      description: |
        Executes the task's prompt against its worker now, outside the normal
        schedule. Useful for testing or one-off triggers from the GUI.
        Returns the raw response text from the worker.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunResponse"
        "404":
          description: Task not found
        "408":
          description: Worker did not respond within timeout
        "501":
          description: Not yet implemented

  /api/v1/tasks/{task_id}/history:
    get:
      operationId: getTaskHistory
      summary: Get recent run history for a task
      description: Returns the last N executions with timestamps, status, and response preview.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskHistoryResponse"
        "404":
          description: Task not found
        "501":
          description: Not yet implemented

  # ─── Workers (planned) ────────────────────────────────────────────────────────

  /api/v1/workers:
    get:
      operationId: listWorkers
      summary: List configured workers
      description: Returns all workers defined in the running configuration.
      tags: [workers]
      responses:
        "200":
          description: Worker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListResponse"
        "501":
          description: Not yet implemented

  /api/v1/workers/{worker_id}:
    get:
      operationId: getWorker
      summary: Get a worker by ID
      tags: [workers]
      parameters:
        - $ref: "#/components/parameters/WorkerID"
      responses:
        "200":
          description: Worker detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Worker not found
        "501":
          description: Not yet implemented

  /api/v1/workers/{worker_id}/sessions:
    get:
      operationId: listWorkerSessions
      summary: List active sessions for a worker
      tags: [workers, sessions]
      parameters:
        - $ref: "#/components/parameters/WorkerID"
      responses:
        "200":
          description: Active session keys for the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "404":
          description: Worker not found
        "501":
          description: Not yet implemented

  # ─── Channels (planned) ───────────────────────────────────────────────────────

  /api/v1/channels:
    get:
      operationId: listChannels
      summary: List configured channels
      description: Returns all channel adapters defined in the running configuration.
      tags: [channels]
      responses:
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelListResponse"
        "501":
          description: Not yet implemented

  /api/v1/channels/{channel_id}:
    get:
      operationId: getChannel
      summary: Get a channel by ID
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Channel detail (token is redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          description: Channel not found
        "501":
          description: Not yet implemented

  /api/v1/channels/{channel_id}/cursor:
    get:
      operationId: getChannelCursor
      summary: Get the current deduplication cursor for a channel
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Current cursor value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorResponse"
        "404":
          description: Channel not found
        "501":
          description: Not yet implemented

  # ─── Wirings (planned) ────────────────────────────────────────────────────────

  /api/v1/wirings:
    get:
      operationId: listWirings
      summary: List all wiring rules
      tags: [wirings]
      responses:
        "200":
          description: Wiring list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiringListResponse"
        "501":
          description: Not yet implemented

# ─── Components ───────────────────────────────────────────────────────────────

components:

  parameters:
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
      description: Task identifier as defined in tasks.yaml
      example: morning-standup

    WorkerID:
      name: worker_id
      in: path
      required: true
      schema:
        type: string
      description: Worker identifier as defined in config
      example: assistant

    ChannelID:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
      description: Channel identifier as defined in config
      example: my-telegram

  schemas:

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always "ok" when the daemon is running

    SessionListResponse:
      type: object
      required: [count, active_sessions]
      properties:
        count:
          type: integer
          description: Number of active sessions
          example: 2
        active_sessions:
          type: array
          items:
            type: string
          description: |
            Session keys. Format depends on session_mode:
            - worker-shared → `{worker_id}`
            - shared        → `{worker_id}:{channel_id}`
            - per-user      → `{worker_id}:{channel_id}:{sender_id}`
          example:
            - "assistant:my-telegram:123456789"

    Worker:
      type: object
      required: [id, work_dir, session_timeout_minutes]
      properties:
        id:
          type: string
          example: assistant
        work_dir:
          type: string
          example: /home/user/.aide/sessions/assistant
        session_timeout_minutes:
          type: integer
          example: 60
        active_session_count:
          type: integer
          description: Number of currently alive PTY sessions for this worker
          example: 3

    WorkerListResponse:
      type: object
      required: [workers]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/Worker"

    Channel:
      type: object
      required: [id, type, poll_interval_secs]
      properties:
        id:
          type: string
          example: my-telegram
        type:
          type: string
          enum: [telegram, webex]
          example: telegram
        poll_interval_secs:
          type: number
          example: 5
        room_id:
          type: string
          description: Webex room ID (webex channels only)
          example: "Y2lzY29zcGFyazovL3VzL1JPT00vexample"
        cursor:
          type: string
          description: Current deduplication cursor (update_id for Telegram, ISO timestamp for Webex)
          example: "42"

    ChannelListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    Wiring:
      type: object
      required: [channel_id, worker_id, engage_mode, session_mode]
      properties:
        channel_id:
          type: string
          example: my-telegram
        worker_id:
          type: string
          example: assistant
        engage_mode:
          type: string
          enum: [always, mention, pattern]
          example: always
        engage_pattern:
          type: string
          description: Regex pattern (required when engage_mode is "pattern")
          example: "^!bot"
        session_mode:
          type: string
          enum: [per-user, shared, worker-shared]
          example: per-user

    WiringListResponse:
      type: object
      required: [wirings]
      properties:
        wirings:
          type: array
          items:
            $ref: "#/components/schemas/Wiring"

    TaskOutput:
      type: object
      required: [channel_id, room_id]
      properties:
        channel_id:
          type: string
          example: my-telegram
        room_id:
          type: string
          example: "123456789"

    Task:
      type: object
      required: [id, worker_id, prompt, schedule, outputs]
      properties:
        id:
          type: string
          example: morning-standup
        name:
          type: string
          example: Morning Standup Summary
        enabled:
          type: boolean
          example: true
        worker_id:
          type: string
          example: assistant
        session_mode:
          type: string
          enum: [task-isolated, worker-shared, shared]
          default: task-isolated
          description: |
            - `task-isolated` — dedicated PTY per task, never shares context with users
            - `worker-shared` — reuses the worker's global shared session
            - `shared`        — shared across all tasks for this worker
        prompt:
          type: string
          description: The prompt text sent to the worker on each scheduled run
          example: "Give a brief morning standup summary for the team."
        schedule:
          type: string
          description: |
            Cron expression (5-field) or shorthand:
            `@hourly`, `@daily`, `@weekly`, `@monthly`
          example: "0 9 * * 1-5"
        timeout_secs:
          type: integer
          default: 120
          description: Max seconds to wait for the worker to respond
          example: 120
        outputs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaskOutput"

    TaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    TaskRunResponse:
      type: object
      required: [task_id, response, executed_at]
      properties:
        task_id:
          type: string
          example: morning-standup
        response:
          type: string
          description: The worker's reply text
          example: "Good morning! Today's priorities are..."
        executed_at:
          type: string
          format: date-time
          example: "2026-08-20T09:00:01Z"
        duration_ms:
          type: integer
          description: How long the worker took to respond in milliseconds
          example: 3240

    TaskRunRecord:
      type: object
      required: [task_id, status, executed_at]
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [success, timeout, error]
        executed_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        response_preview:
          type: string
          description: First 200 characters of the response
        error:
          type: string
          description: Error message if status is not success

    TaskHistoryResponse:
      type: object
      required: [task_id, runs]
      properties:
        task_id:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/TaskRunRecord"

    CursorResponse:
      type: object
      required: [channel_id, cursor]
      properties:
        channel_id:
          type: string
          example: my-telegram
        cursor:
          type: string
          description: Opaque cursor string; format is channel-type specific
          example: "142"
