# aide configuration
# Copy to config.yaml and fill in your credentials.

claude_path: claude                        # path to claude CLI binary
work_dir: ~/.aide                       # base directory for all session subdirs
db_path: ~/.aide/aide.db             # SQLite cursor + agent session persistence
tasks_path: ~/.aide/tasks.yaml             # scheduled tasks file (optional)
agents_socket_path: ~/.aide/agents.sock    # unix socket for the aide-agents HTTP API

channels:
  - id: my-telegram
    type: telegram
    bot_token: "123456:ABC-your-token-here"
    poll_interval_secs: 5

  - id: my-webex
    type: webex
    bot_token: "your-webex-bot-token"
    room_id: "Y2lzY29zcGFyazovL3VzL1JPT00vexample"
    poll_interval_secs: 10

  - id: my-webex-dm
    type: webex
    bot_token: "your-webex-bot-token"
    room_id: "Y2lzY29zcGFyazovL3VzL1JPT00vdirect-example"
    direct: true          # 1:1 direct room — all messages delivered, no @mention needed
    poll_interval_secs: 10

workers:
  - id: assistant
    work_dir: ~/.aide/sessions/assistant  # optional; defaults to work_dir/<id>
    session_timeout_minutes: 60

  - id: coder
    work_dir: ~/.aide/sessions/coder
    session_timeout_minutes: 120

# aide-agents: external, custom-built processes that call the unix-socket API
# for Claude inference and (optionally) channel relay. See aide-agents repo's
# docs/design.md for the full protocol. Omit this section entirely if you
# don't have any agents yet.
agents:
  - id: disk-usage-watcher
    token: "your-disk-usage-watcher-token"     # bearer token the agent must present
    models_allowed: ["claude-sonnet-5", "claude-haiku-4-5"]
    default_model: "claude-sonnet-5"
    effort_allowed: ["low", "medium"]
    default_effort: "low"
    rate_limit:
      max_requests: 20
      window_minutes: 60
    max_turns_per_session: 50
    max_session_duration_minutes: 480
    idle_timeout_minutes: 1440
    # Omit channels_allowed entirely if this agent never calls /messages —
    # e.g. because it posts to Webex/Telegram directly with its own bot token.
    channels_allowed:
      - channel_id: my-webex
        room_ids: ["Y2lzY29zcGFyazovL3VzL1JPT00vexample"]

  # Token here is what the long-lived process passes to POST /heartbeat.
  # See tasks.example.yaml's "queue-poller" entry (type: agent,
  # agent_mode: supervised) — its agent_id must match this id.
  - id: queue-poller
    token: "your-queue-poller-token"
    default_model: "claude-haiku-4-5"

# Docker-specific settings — only used by launchdocker.sh, ignored by aide itself.
# Lists extra bind-mounts to inject into the generated compose file.
# Use Docker volume syntax: host_path:container_path[:mode]
# Tilde (~) is expanded to your home directory.
docker:
  volumes: []
    # - ~/.certs:/home/aide/.certs:ro              # mTLS certs for Jira/Bitbucket/Confluence
    # - ~/git:/home/aide/git:rw                    # code checkouts
    # - ~/webex-scribe-home:/home/aide/webex-scribe-home:rw

wirings:
  # Every Telegram message → assistant, one session per user
  # allowed_users: use numeric Telegram user IDs (find yours by messaging @userinfobot)
  - channel_id: my-telegram
    worker_id: assistant
    engage_mode: always
    session_mode: per-user
    allowed_users:
      - "123456789"   # your Telegram user ID

  # Webex: only respond when @mentioned, whole room shares one session
  - channel_id: my-webex
    worker_id: assistant
    engage_mode: mention
    session_mode: shared

  # Webex: route messages starting with "!code" to the coder worker
  - channel_id: my-webex
    worker_id: coder
    engage_mode: pattern
    engage_pattern: "^!code"
    session_mode: worker-shared

  # Webex DM: respond to everything, but only from specific users
  - channel_id: my-webex-dm
    worker_id: assistant
    engage_mode: always
    session_mode: per-user
    allowed_users:
      - you@example.com
      - colleague@example.com
