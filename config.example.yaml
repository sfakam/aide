# aide configuration
# Copy to config.yaml and fill in your credentials.

claude_path: claude                        # path to claude CLI binary
work_dir: ~/.aide                       # base directory for all session subdirs
db_path: ~/.aide/aide.db             # SQLite cursor persistence
tasks_path: ~/.aide/tasks.yaml             # scheduled tasks file (optional)

channels:
  - id: my-telegram
    type: telegram
    bot_token: "123456:ABC-your-token-here"
    poll_interval_secs: 5

  - id: my-webex
    type: webex
    bot_token: "your-webex-bot-token"
    room_id: "Y2lzY29zcGFyazovL3VzL1JPT00vexample"
    poll_interval_secs: 10

  - id: my-webex-dm
    type: webex
    bot_token: "your-webex-bot-token"
    room_id: "Y2lzY29zcGFyazovL3VzL1JPT00vdirect-example"
    direct: true          # 1:1 direct room — all messages delivered, no @mention needed
    poll_interval_secs: 10

workers:
  - id: assistant
    work_dir: ~/.aide/sessions/assistant  # optional; defaults to work_dir/<id>
    session_timeout_minutes: 60

  - id: coder
    work_dir: ~/.aide/sessions/coder
    session_timeout_minutes: 120

# Docker-specific settings — only used by launchdocker.sh, ignored by aide itself.
# Lists extra bind-mounts to inject into the generated compose file.
# Use Docker volume syntax: host_path:container_path[:mode]
# Tilde (~) is expanded to your home directory.
docker:
  volumes: []
    # - ~/.certs:/home/aide/.certs:ro              # mTLS certs for Jira/Bitbucket/Confluence
    # - ~/git:/home/aide/git:rw                    # code checkouts
    # - ~/webex-scribe-home:/home/aide/webex-scribe-home:rw

wirings:
  # Every Telegram message → assistant, one session per user
  - channel_id: my-telegram
    worker_id: assistant
    engage_mode: always
    session_mode: per-user

  # Webex: only respond when @mentioned, whole room shares one session
  - channel_id: my-webex
    worker_id: assistant
    engage_mode: mention
    session_mode: shared

  # Webex: route messages starting with "!code" to the coder worker
  - channel_id: my-webex
    worker_id: coder
    engage_mode: pattern
    engage_pattern: "^!code"
    session_mode: worker-shared

  # Webex DM: respond to everything, but only from specific users
  - channel_id: my-webex-dm
    worker_id: assistant
    engage_mode: always
    session_mode: per-user
    allowed_users:
      - you@example.com
      - colleague@example.com
